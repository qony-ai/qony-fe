<section class="slide business-doc">
  <div style="width:100%;background:#fff;border:1px solid #d7d4cc;border-radius:24px;padding:28px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
      <h2 style="font-size:24px;line-height:1.2;color:#1d2421;margin:0;">{{title}}</h2>
      <span style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#6f766f;">{{type}}</span>
    </div>
    <p style="font-size:15px;line-height:1.8;color:#414847;margin-top:18px;">{{body}}</p>
  </div>
</section>

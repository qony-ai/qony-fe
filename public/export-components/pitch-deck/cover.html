<section class="slide slide-cover">
  <h1 class="slide-title">{{title}}</h1>
  {{#if tagline}}
  <p class="slide-tagline">{{tagline}}</p>
  {{/if}}
  <footer class="slide-meta">
    {{#if author}}<span class="author">{{author}}</span>{{/if}}
    {{#if date}}<span class="date">{{date}}</span>{{/if}}
  </footer>
</section>
